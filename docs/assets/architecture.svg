<svg xmlns="http://www.w3.org/2000/svg" width="940" height="590" viewBox="0 0 940 590" role="img" aria-labelledby="title desc">
  <title id="title">Peer Point OS deployment architecture</title>
  <desc id="desc">Cloudflare Access with the Cloudflare identity provider protects the Router, the only public Worker. The Router reaches seven private Workers over service bindings: Workshop, Context, Scheduler, GitHub, MCP Portal, Custom, and Error Reporter. GitHub and the Cloudflare MCP Portal use per-attendee OAuth as connected capabilities, not identity. Workshop reaches the same-account peer-point-os AI Gateway through a Workers AI binding without an API token. Preview URLs are disabled for all eight Workers.</desc>
  <style>
    .bg{fill:#f6f8fa}
    .group{fill:#fff;fill-opacity:.55;stroke:#d0d7de;stroke-dasharray:6 4}
    .owned{fill:#ddf4ff;fill-opacity:.35;stroke:#0969da;stroke-opacity:.55;stroke-width:1.4}
    .card{fill:#fff;stroke:#d0d7de}
    .core{fill:#fff;stroke:#f6821f;stroke-width:1.6}
    .identity{fill:#fff8c5;stroke:#bf8700;stroke-opacity:.55}
    .sep{fill:none;stroke:#d0d7de}
    .t{fill:#1f2328;font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .g{fill:#1f2328;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .s{fill:#656d76;font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .xs{fill:#656d76;font:10px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .line{fill:none;stroke:#afb8c1;stroke-width:1.5}
    .accent{stroke:#f6821f}
    .dash{stroke-dasharray:5 4}
    .pill{fill:#fff1e5;stroke:#f6821f;stroke-opacity:.35}
    .pill-t{fill:#a2551a;font:600 9px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.5px}
    .pill-b{fill:#ddf4ff;stroke:#0969da;stroke-opacity:.4}
    .pill-bt{fill:#0a3069;font:600 9px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.5px}
    @media(prefers-color-scheme:dark){
      .bg{fill:#0d1117}
      .group{fill:#161b22;fill-opacity:.45;stroke:#30363d}
      .owned{fill:#0c2d6b;fill-opacity:.22;stroke:#388bfd;stroke-opacity:.55}
      .card,.core{fill:#161b22;stroke:#30363d}
      .core{stroke:#f6821f}
      .identity{fill:#272115;stroke:#d29922}
      .sep{stroke:#30363d}
      .t,.g{fill:#e6edf3}
      .s,.xs{fill:#8b949e}
      .line{stroke:#484f58}
      .accent{stroke:#f6821f}
      .pill{fill:#2a1a0c}
      .pill-t{fill:#ffa657}
      .pill-b{fill:#0d2847}
      .pill-bt{fill:#79c0ff}
    }
  </style>
  <defs>
    <marker id="ao" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8z" fill="#f6821f"/>
    </marker>
    <marker id="ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8z" fill="#afb8c1"/>
    </marker>
  </defs>

  <rect class="bg" width="940" height="590" rx="12"/>

  <rect class="identity" x="24" y="42" width="224" height="74" rx="8"/>
  <text class="t" x="42" y="67">Cloudflare Access identity</text>
  <text class="s" x="42" y="86">Cloudflare Dashboard account IdP</text>
  <text class="s" x="42" y="103">Verified email; Access only</text>

  <path class="line accent" d="M136 116V148" marker-end="url(#ao)"/>

  <rect class="core" x="24" y="154" width="224" height="158" rx="8"/>
  <path class="pill" d="M144 154H240A8 8 0 0 1 248 162V176H149A5 5 0 0 1 144 171Z"/>
  <text class="pill-t" x="196" y="168" text-anchor="middle">ONLY PUBLIC WORKER</text>
  <text class="t" x="42" y="199">Router · peer-point-os</text>
  <text class="s" x="42" y="218">os.cf.prompt2prod.dev</text>
  <path class="sep" d="M42 231h188"/>
  <text class="s" x="42" y="251">/api → Workshop</text>
  <text class="s" x="42" y="270">/gatekeeper/* → private Gatekeeper</text>
  <text class="s" x="42" y="289">Everything else → frontend</text>

  <rect class="card" x="24" y="345" width="224" height="92" rx="8"/>
  <text class="t" x="42" y="370">Public exposure policy</text>
  <text class="s" x="42" y="389">8 Workers total</text>
  <text class="s" x="42" y="407">preview_urls = false on all</text>
  <text class="s" x="42" y="425">7 private Workers: workers_dev = false</text>

  <path class="line accent" d="M248 233h38" marker-end="url(#ao)"/>

  <rect class="group" x="294" y="30" width="318" height="530" rx="12"/>
  <text class="g" x="314" y="59">Private service-bound Workers</text>
  <text class="s" x="314" y="77">No routes; dependencies deploy before Router</text>

  <rect class="core" x="314" y="96" width="278" height="68" rx="8"/>
  <text class="t" x="332" y="122">Workshop · peer-point-os-backend</text>
  <text class="s" x="332" y="141">Kernel, Durable Objects, model policy, RPC</text>

  <rect class="card" x="314" y="180" width="134" height="64" rx="8"/>
  <text class="t" x="330" y="206">Context</text>
  <text class="xs" x="330" y="224">Ambient capability</text>

  <rect class="card" x="458" y="180" width="134" height="64" rx="8"/>
  <text class="t" x="474" y="206">Scheduler</text>
  <text class="xs" x="474" y="224">Ambient capability</text>

  <rect class="card" x="314" y="260" width="134" height="82" rx="8"/>
  <text class="t" x="330" y="286">GitHub</text>
  <text class="xs" x="330" y="304">OAuth App capability</text>
  <text class="xs" x="330" y="322">Mutations need approval</text>

  <rect class="card" x="458" y="260" width="134" height="82" rx="8"/>
  <text class="t" x="474" y="286">MCP Portal</text>
  <text class="xs" x="474" y="304">Per-attendee OAuth</text>
  <text class="xs" x="474" y="322">Mutations need approval</text>

  <rect class="card" x="314" y="358" width="134" height="64" rx="8"/>
  <text class="t" x="330" y="384">Custom</text>
  <text class="xs" x="330" y="402">Example capability</text>

  <rect class="card" x="458" y="358" width="134" height="64" rx="8"/>
  <text class="t" x="474" y="384">Error Reporter</text>
  <text class="xs" x="474" y="402">Explicit issues</text>

  <rect class="card" x="314" y="440" width="278" height="86" rx="8"/>
  <text class="t" x="332" y="466">KV + R2 + Durable Objects</text>
  <text class="s" x="332" y="485">Owned by account b157…05ff</text>
  <text class="s" x="332" y="503">No organizer credential exposed to attendees</text>

  <path class="line" d="M612 130h34" marker-end="url(#ag)"/>
  <path class="line" d="M612 300h34" marker-end="url(#ag)"/>

  <rect class="owned" x="654" y="30" width="262" height="530" rx="12"/>
  <text class="g" x="674" y="59">Bound services</text>
  <text class="s" x="674" y="77">Identity is not delegated to these services</text>
  <path class="pill-b" d="M832 30H904A12 12 0 0 1 916 42V54H838A6 6 0 0 1 832 48Z"/>
  <text class="pill-bt" x="874" y="44" text-anchor="middle">PEER POINT</text>

  <rect class="card" x="674" y="96" width="222" height="120" rx="8"/>
  <text class="t" x="692" y="122">AI Gateway · peer-point-os</text>
  <text class="s" x="692" y="141">Same account; WORKERS_AI binding</text>
  <text class="s" x="692" y="159">7 Workers AI models; no API token</text>
  <text class="s" x="692" y="177">Quick: GLM 5.3 Flash</text>
  <text class="s" x="692" y="195">Logs verified email in 5-key policy</text>

  <rect class="card" x="674" y="238" width="222" height="112" rx="8"/>
  <text class="t" x="692" y="264">Cloudflare MCP Server Portal</text>
  <text class="s" x="692" y="283">Real Portal endpoint; Code Mode off</text>
  <text class="s" x="692" y="301">Upstream: mcp.cloudflare.com/mcp</text>
  <text class="s" x="692" y="319">Trust annotations false</text>
  <text class="s" x="692" y="337">Portal admin tools excluded</text>

  <rect class="card" x="674" y="372" width="222" height="82" rx="8"/>
  <text class="t" x="692" y="398">GitHub OAuth App</text>
  <text class="s" x="692" y="417">repo · read:user · user:email</text>
  <text class="s" x="692" y="435">Per-attendee account and repository</text>

  <rect class="card" x="674" y="476" width="222" height="50" rx="8"/>
  <text class="t" x="692" y="500">Admin GUI</text>
  <text class="s" x="692" y="518">Branding, instructions, connectors</text>
</svg>
